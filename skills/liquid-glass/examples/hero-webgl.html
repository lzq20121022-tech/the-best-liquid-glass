<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Glass · Hero (WebGL engine)</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif; }
  .hero { position: relative; height: 100vh; min-height: 620px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; color: #fff; text-align: center; }
  .hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .nav { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 7px; border-radius: 999px; }
  .nav a { color: var(--lg-fg, #fff); text-decoration: none; padding: 11px 18px; border-radius: 999px; font-weight: 600; font-size: 15px; }
  h1 { font-size: clamp(44px, 8vw, 104px); line-height: 1; margin: 0; letter-spacing: -0.03em; text-shadow: 0 4px 40px rgba(0, 0, 0, .25); }
  .card { width: min(440px, 88vw); padding: 24px 28px; border-radius: 34px; color: var(--lg-fg, #fff); text-align: left; }
  .card h3 { margin: 0 0 6px; font-size: 20px; }
  .card p { margin: 0; color: var(--lg-fg-2, rgba(255,255,255,.75)); line-height: 1.5; }
  .btn { padding: 17px 32px; border-radius: 999px; border: 0; font: 600 17px/1 inherit; color: var(--lg-fg, #fff); cursor: pointer; background: rgba(255, 255, 255, .2); }
  .lens { position: absolute; left: 70%; top: 62%; width: 190px; height: 190px; border-radius: 50%; cursor: grab; touch-action: none; }
  .hint { position: absolute; bottom: 18px; left: 0; right: 0; font-size: 13px; opacity: .7; }
</style>
</head>
<body>
<section class="hero">
  <img id="bg" src="assets/photo.jpg" alt="">
  <nav class="nav"><a href="#">Home</a><a href="#">Gallery</a><a href="#">Pricing</a><a href="#">About</a></nav>
  <h1>Liquid Glass</h1>
  <div class="card">
    <h3>Physically based</h3>
    <p>Snell refraction on a squircle bevel, spectral dispersion, Fresnel reflection and a specular rim tinted by the content.</p>
  </div>
  <button class="btn">Get started</button>
  <div class="lens" aria-hidden="true"></div>
  <div class="hint">Drag the round lens · press any glass</div>
</section>

<script src="../assets/liquid-glass.js"></script>
<script>
  // preset 'auto': the library measures brightness & busyness behind each element and tunes it.
  const lg = LiquidGlass.create({ background: '#bg', preset: 'auto' });
  lg.add('.nav', { role: 'navbar' })
    .add('.card', { role: 'card' })
    .add('.btn', { role: 'button' })
    .add('.lens', { role: 'lens', emphasis: 'showcase' });

  // drag the lens
  const lens = document.querySelector('.lens');
  let drag = null;
  lens.addEventListener('pointerdown', (e) => { drag = { x: e.clientX - lens.offsetLeft, y: e.clientY - lens.offsetTop }; lens.setPointerCapture(e.pointerId); });
  lens.addEventListener('pointermove', (e) => { if (!drag) return; lens.style.left = e.clientX - drag.x + 'px'; lens.style.top = e.clientY - drag.y + 'px'; });
  lens.addEventListener('pointerup', () => (drag = null));
</script>
</body>
</html>
